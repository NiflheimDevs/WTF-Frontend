<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>سامانه گزارش‌دهی آب</title>

    <!-- Prevent flash of wrong theme/locale — runs before React loads -->
    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme");
        const path = window.location.pathname;
        const isDispatcher = path.startsWith("/dispatcher");
        const theme = savedTheme || (isDispatcher ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") document.documentElement.classList.add("dark");

        const savedLocale = localStorage.getItem("locale");
        const locale =
          savedLocale === "en" || savedLocale === "fa" ? savedLocale : "fa";
        document.documentElement.lang = locale;
        document.documentElement.dir = locale === "fa" ? "rtl" : "ltr";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
